default:
  image: node:24-bookworm

variables:
  HUGO_VERSION: "0.168.0"
  PAGEFIND_VERSION: "1.6.0"

.build:
  cache:
    key: hugo-resources
    paths:
      - resources/_gen/
  before_script:
    - |
      (
        cd /tmp
        curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
        curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
        grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
        tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -C /usr/local/bin hugo
      )
    - hugo version
  script:
    - hugo --gc
    - npx -y "pagefind@${PAGEFIND_VERSION}" --site public

test:
  extends: .build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  extends: .build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
